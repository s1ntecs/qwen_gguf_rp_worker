name: Python tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile handler.py workflow_builder.py lora_catalog.py scripts/download_models.py scripts/patch_gguf_adapters.py custom_nodes/qwen_lora_manager.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run UI LoRA tests
        run: node --test tests/test_webui_loras.cjs
